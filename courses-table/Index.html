<!DOCTYPE html><html><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
 :root{color-scheme:dark;--bg:#252525;--surface:#2d2d2c;--line:#403f3c;--ink:#f7f4f4;--soft:#cfcac2;--faint:#9d978d;--coral:#ff7f58;--tea:#cde3ba}
 html,body{background:var(--bg);color:var(--ink)}
 body{font:15px/1.5 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;margin:0;padding:0 24px 32px}
 #bar{height:64px;box-sizing:border-box;padding:12px 0;display:flex;gap:12px;align-items:center;position:sticky;top:0;background:var(--bg);z-index:3}
 input{padding:9px 14px;border:1px solid var(--line);border-radius:8px;width:260px;font:inherit;background:var(--surface);color:var(--ink)}
 input::placeholder{color:var(--faint)} input:focus{outline:2px solid var(--coral);border-color:transparent}
 button{font:inherit;font-size:13px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--soft);cursor:pointer}
 button:hover{color:var(--ink);border-color:var(--coral)}
 #msg{color:var(--faint);font-size:13px;margin-left:auto}
 table{border-collapse:separate;border-spacing:0;width:100%}
 th,td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
 td{color:var(--soft);overflow-wrap:anywhere} td.first{color:var(--ink);font-weight:600}
 th{position:sticky;top:64px;z-index:2;background:var(--surface);color:var(--tea);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;cursor:pointer;user-select:none}
 th:hover{color:var(--ink)} th .ar{display:inline-block;width:12px;margin-left:6px;color:var(--coral)}
 th:first-child{border-radius:8px 0 0 0} th:last-child{border-radius:0 8px 0 0}
 tr.r:hover td{background:var(--surface)}
 tr.g td{padding:28px 0 10px;border:0;cursor:pointer;user-select:none}
 .gt{font-size:22px;font-weight:800;color:var(--coral)}
 .chev{display:inline-block;width:20px;color:var(--faint);transition:transform .15s} .closed .chev{transform:rotate(-90deg)}
 .g small{display:inline-block;margin-left:10px;padding:1px 10px;border-radius:999px;background:var(--tea);color:#252525;font-size:12px;font-weight:700;vertical-align:middle}
 a{color:var(--coral);text-decoration:none;font-weight:600} a:hover{text-decoration:underline}
 #err{color:var(--coral);padding:24px 0}
</style></head><body>
<div id="bar">
  <input id="q" placeholder="Search" autocomplete="off">
  <button id="bc" title="Collapse all groups">Collapse all</button>
  <button id="be" title="Expand all groups">Expand all</button>
  <button id="br" title="Reload from monday">&#8635; Refresh</button>
  <span id="msg">Loading…</span>
</div>
<div id="err"></div>
<table id="t" hidden><colgroup id="cg"></colgroup><thead id="h"></thead><tbody id="b"></tbody></table>
<script>
let D, widths = [], closed = {}, sortIdx = -1, sortDir = 1;

function load(force) {
  msg.textContent = 'Loading…'; err.textContent = '';
  google.script.run
    .withSuccessHandler(d => { try { D = d; init(); draw(); } catch (e) { err.textContent = 'Display error: ' + e.message; msg.textContent = ''; } })
    .withFailureHandler(e => { err.textContent = 'Error: ' + e.message; msg.textContent = ''; })
    .getTable(!!force);
}
function init() {
  closed = {}; if (D.collapsed) D.groups.forEach((g, i) => closed[i] = true);
  sortIdx = D.defaultSort ? D.defaultSort.index : -1; sortDir = D.defaultSort ? D.defaultSort.dir : 1;
  D.userSorted = false;
  // Column widths: ID-like (short) columns and link columns are 1.3x the old width so headers stay on one line.
  widths = D.headers.map((h, i) => {
    const vals = D.groups.flatMap(g => g.rows.map(r => r[i])).filter(Boolean);
    if (vals.length && vals.every(v => /^https?:\/\//.test(v))) return 170;
    if (vals.length && vals.every(v => v.length <= 8)) return 120;
    return 0;
  });
  cg.innerHTML = widths.map(w => w ? `<col style="width:${w}px">` : '<col>').join('');
  t.hidden = false;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function cell(v, i) {
  const c = i === 0 ? ' class="first"' : '';
  return /^https?:\/\//.test(v) ? `<td${c}><a href="${esc(v)}" target="_blank" rel="noopener">Open &#8599;</a></td>` : `<td${c}>${esc(v)}</td>`;
}
function cmp(a, b) {
  if (!a || !b) return a === b ? 0 : (a ? -1 : 1);                 // empty last
  const num = /^-?[\d.,]+$/;
  return num.test(a) && num.test(b) ? parseFloat(a.replace(/,/g, '')) - parseFloat(b.replace(/,/g, ''))
    : a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'});
}
function draw() {
  const f = q.value.trim().toLowerCase(); let n = 0, html = '';
  h.innerHTML = '<tr>' + D.headers.map((x, i) => `<th data-i="${i}">${esc(x)}<span class="ar">${sortIdx === i ? (sortDir > 0 ? '&#9650;' : '&#9660;') : ''}</span></th>`).join('') + '</tr>';
  h.querySelectorAll('th').forEach(th => th.onclick = () => {
    const i = +th.dataset.i;
    if (sortIdx === i && sortDir > 0) sortDir = -1;
    else if (sortIdx === i && sortDir < 0) { sortIdx = D.defaultSort ? D.defaultSort.index : -1; sortDir = D.defaultSort ? D.defaultSort.dir : 1; }
    else { sortIdx = i; sortDir = 1; }
    draw();
  });
  D.groups.forEach((g, gi) => {
    let rows = g.rows.filter(r => !f || r.some(c => c.toLowerCase().includes(f)));
    if (!rows.length) return;
    n += rows.length;
    if (sortIdx >= 0) rows = rows.slice().sort((a, b) => cmp(a[sortIdx], b[sortIdx]) * sortDir || 0);
    const shut = !f && closed[gi];
    if (D.groupBy) html += `<tr class="g${shut ? ' closed' : ''}" data-g="${gi}"><td colspan="${D.headers.length}"><span class="chev">&#9662;</span><span class="gt">${esc(g.title)}</span><small>${rows.length}</small></td></tr>`;
    if (!shut) html += rows.map(r => '<tr class="r">' + r.map(cell).join('') + '</tr>').join('');
  });
  b.innerHTML = html;
  b.querySelectorAll('tr.g').forEach(tr => tr.onclick = () => { closed[tr.dataset.g] = !closed[tr.dataset.g]; draw(); });
  msg.textContent = n + ' of ' + D.total + ' courses · updated ' + new Date(D.updated).toLocaleTimeString();
}
q.oninput = () => D && draw();
bc.onclick = () => { D.groups.forEach((g, i) => closed[i] = true); draw(); };
be.onclick = () => { closed = {}; draw(); };
br.onclick = () => load(true);
load(false);
</script></body></html>
